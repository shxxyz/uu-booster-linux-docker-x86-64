name: netease-uu

services:
  uu:
    image: netease-uu-openwrt:local
    build:
      context: .
      network: host
      args:
        HTTP_PROXY: ${DOWNLOAD_PROXY:-}
        HTTPS_PROXY: ${DOWNLOAD_PROXY:-}
        NO_PROXY: localhost,127.0.0.1
    platform: linux/amd64
    container_name: netease-uu
    hostname: netease-uu
    restart: unless-stopped
    # The image entrypoint already starts tini as PID 1.
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun:rwm
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
      net.ipv4.conf.all.send_redirects: "0"
      net.ipv4.conf.default.send_redirects: "0"
      net.ipv4.conf.all.accept_redirects: "0"
      net.ipv4.conf.default.accept_redirects: "0"
    environment:
      UU_CONTAINER_IP: ${UU_CONTAINER_IP:?set UU_CONTAINER_IP in .env}
      UU_LAN_SUBNET: ${UU_LAN_SUBNET:?set UU_LAN_SUBNET in .env}
      UU_UPSTREAM_GATEWAY: ${UU_UPSTREAM_GATEWAY:?set UU_UPSTREAM_GATEWAY in .env}
      UU_UPSTREAM_DNS: ${UU_UPSTREAM_DNS:?set UU_UPSTREAM_DNS in .env}
      UU_SNAT_MODE: ${UU_SNAT_MODE:-off}
    dns:
      - ${UU_UPSTREAM_DNS:?set UU_UPSTREAM_DNS in .env}
    volumes:
      - uu_state:/usr/sbin/uu
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=96m,mode=1777
      - /run:rw,nosuid,nodev,size=8m,mode=755
    pids_limit: 512
    mem_limit: 512m
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "/usr/local/sbin/uu-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 45s
    networks:
      uu_lan:
        ipv4_address: ${UU_CONTAINER_IP:?set UU_CONTAINER_IP in .env}
        mac_address: ${UU_MAC_ADDRESS:?set UU_MAC_ADDRESS in .env}

networks:
  uu_lan:
    name: netease-uu-lan
    driver: macvlan
    driver_opts:
      parent: ${UU_PARENT_INTERFACE:?set UU_PARENT_INTERFACE in .env}
      macvlan_mode: bridge
    ipam:
      config:
        - subnet: ${UU_LAN_SUBNET:?set UU_LAN_SUBNET in .env}
          gateway: ${UU_UPSTREAM_GATEWAY:?set UU_UPSTREAM_GATEWAY in .env}

volumes:
  uu_state:
    name: netease-uu-state
